services:
  mymvcapp:
    build:
      context: ./MyMvcApp
      dockerfile: Dockerfile
    image: mymvcapp:latest
    container_name: mymvcapp
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsRedirection: "false"

      # ✅ ADD THESE

      AWS__UserPoolClientSecret: ${AWS_USER_POOL_CLIENT_SECRET}
      AWS__AccessKey: ${AWS_ACCESS_KEY}
      AWS__SecretKey: ${AWS_SECRET_KEY}

    restart: unless-stopped
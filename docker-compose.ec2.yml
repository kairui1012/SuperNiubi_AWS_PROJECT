version: "3.8"

services:
  # AWS X-Ray Daemon Service
  xray-daemon:
    image: amazon/aws-xray-daemon:latest
    container_name: xray-daemon
    ports:
      - "2000:2000/udp"
    environment:
      - AWS_REGION=ap-southeast-1
    restart: unless-stopped

  # Your Main Application Service
  mymvcapp:
    build:
      context: ./MyMvcApp
      dockerfile: Dockerfile
    image: mymvcapp:latest
    container_name: mymvcapp
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsRedirection: "false"
      EnableForwardedHeaders: ${ENABLE_FORWARDED_HEADERS:-false}

      # Google OAuth
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}

      # DataProtection keys path (must be on persistent storage)
      DATAPROTECTION_KEYS_PATH: /var/propease/dataprotection-keys

      # AWS Credentials
      AWS__UserPoolClientSecret: ${AWS_USER_POOL_CLIENT_SECRET}
      AWS__AccessKey: ${AWS_ACCESS_KEY}
      AWS__SecretKey: ${AWS_SECRET_KEY}

      # AWS X-Ray Link
      AWS_XRAY_DAEMON_ADDRESS: xray-daemon:2000

    volumes:
      # CRITICAL: Mount persistent volume for DataProtection keys
      # This ensures keys survive container restarts and are shared across instances
      - /var/propease/dataprotection-keys:/var/propease/dataprotection-keys

    depends_on:
      - xray-daemon
    restart: unless-stopped
